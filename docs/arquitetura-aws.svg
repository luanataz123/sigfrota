<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" width="1500" height="1010" font-family="Amazon Ember, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Arquitetura AWS do SIG Frota — Módulo de Lavagem</title>
  <desc id="desc">Diagrama serverless: CloudFront e S3 para o front React, Cognito para login, API Gateway HTTP com authorizer JWT, Lambdas Node.js com o módulo de domínio, DynamoDB tabela única; fluxos de IA com S3, EventBridge, Step Functions e Bedrock para leitura de recibo e extração de regras do PL/SQL; IAM, KMS, CloudWatch, SSM e CloudFormation/CDK transversais.</desc>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
    <marker id="setaCinza" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7D8998"/>
    </marker>

    <!-- Ícones no estilo AWS (cores por categoria) -->
    <symbol id="i-cloudfront" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="6" fill="#8C4FFF"/>
      <circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="3"/>
      <ellipse cx="32" cy="32" rx="7" ry="17" fill="none" stroke="#fff" stroke-width="2.5"/>
      <line x1="15" y1="32" x2="49" y2="32" stroke="#fff" stroke-width="2.5"/>
    </symbol>
    <symbol id="i-apigw" viewBox="0 0 64 64">
