    <symbol id="i-cognito" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="6" fill="#DD344C"/>
      <circle cx="32" cy="24" r="8" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M17 49 Q17 35 32 35 Q47 35 47 49" fill="none" stroke="#fff" stroke-width="3"/>
    </symbol>
    <symbol id="i-eventbridge" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="6" fill="#E7157B"/>
      <circle cx="32" cy="32" r="6" fill="#fff"/>
      <circle cx="16" cy="18" r="4" fill="#fff"/><circle cx="48" cy="18" r="4" fill="#fff"/>
      <circle cx="16" cy="46" r="4" fill="#fff"/><circle cx="48" cy="46" r="4" fill="#fff"/>
      <path d="M16 18 L32 32 L48 18 M16 46 L32 32 L48 46" stroke="#fff" stroke-width="2.5" fill="none"/>
