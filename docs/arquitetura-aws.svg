      <rect width="64" height="64" rx="6" fill="#7AA116"/>
      <ellipse cx="32" cy="20" rx="17" ry="6" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M15 20 L20 46 Q32 52 44 46 L49 20" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-lambda" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="6" fill="#ED7100"/>
      <text x="32" y="46" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">λ</text>
    </symbol>
    <symbol id="i-dynamo" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="6" fill="#C925D1"/>
